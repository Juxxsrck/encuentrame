<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b1d16">
<link rel="manifest" href="manifest.webmanifest">
<title>Encuéntrame</title>
<style>
  :root { --bg:#2b1d16; --card:#3a2a20; --ink:#fff8ef; --muted:#d9c3ad; --accent:#f2a65a; --ok:#8fd19e; --bad:#ef8a80; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100dvh; background:var(--bg); color:var(--ink); font:18px/1.5 Georgia,serif; display:flex; flex-direction:column; align-items:center; }
  #bar { display:flex; justify-content:space-between; align-items:center; width:100%; max-width:480px; padding:10px 16px 0; font:.8rem/1.2 system-ui,sans-serif; color:var(--muted); }
  button.mini { width:auto; margin:0; padding:6px 12px; border:1px solid #6b5443; border-radius:999px; font:inherit; color:var(--muted); text-align:center; }
  main { width:100%; max-width:480px; padding:24px 16px 48px; }
  h1 { font-size:1.7rem; margin:.2em 0; }
  .card { background:var(--card); border-radius:16px; padding:20px; margin:16px 0; }
  .place { color:var(--accent); text-transform:uppercase; letter-spacing:.12em; font-size:.75rem; }
  .clue { border-left:3px solid var(--accent); padding-left:12px; color:var(--muted); font-style:italic; }
  button { font:inherit; width:100%; padding:14px; margin:8px 0; border-radius:12px; border:1px solid #6b5443; background:transparent; color:var(--ink); text-align:left; }
  button.primary { background:var(--accent); color:#2b1d16; border:0; text-align:center; font-weight:bold; }
  button.bad { border-color:var(--bad); color:var(--bad); }
  button.link { border:0; text-align:center; color:var(--muted); font-size:.85rem; text-decoration:underline; }
  .dots { display:flex; gap:6px; margin:8px 0; }
  .dots i { flex:1; height:5px; border-radius:3px; background:#5b4535; }
  .dots i.on { background:var(--accent); }
  a.lnk { display:block; padding:14px; border-radius:12px; background:#1db954; color:#04210e; text-align:center; font-weight:bold; text-decoration:none; }
  input { font:inherit; width:100%; padding:14px; border-radius:12px; border:1px solid #6b5443; background:#2b1d16; color:var(--ink); text-align:center; letter-spacing:.2em; }
  .bad-msg { color:var(--bad); min-height:1.5em; margin:4px 0 0; }
  .reveal { color:var(--ok); }
  .qr { background:#fff8ef; border-radius:12px; padding:12px; width:min(300px,100%); margin:12px auto; }
  .qr svg { width:100%; height:auto; display:block; }
</style>
</head>
<body>
<div id="bar"><span id="cnt"></span><button class="mini" id="rst">↺ Reiniciar</button></div>
<main id="app"></main>
<script>
// Cifrado compartido (build en Node y navegador): PBKDF2 + AES-GCM
const enc = new TextEncoder();
const dec = new TextDecoder();

const norm = (s) =>
  s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim().replace(/\s+/g, ' ');

const b64 = (u) => btoa(String.fromCharCode(...u));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function deriveKey(pass, salt) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
    base,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

async function encrypt(text, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pass, salt);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(text)));
  return b64(new Uint8Array([...salt, ...iv, ...ct]));
}

// Devuelve el texto o null si la clave es incorrecta
async function decrypt(blob, pass) {
  try {
    const raw = unb64(blob);
    const key = await deriveKey(pass, raw.slice(0, 16));
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(16, 28) }, key, raw.slice(28));
    return dec.decode(pt);
  } catch {
    return null;
  }
}

SvK6nh/G4hBt2tSwsJAx7SLEOvIE/m1KFxOObWEv3688XGvex42g7nEcOJj+gW+D8sbG6YmzQng2yiVPc+IA3g==","m7Flzj++JaBC1Is+lmFxiwAsZjpBEQ9bZ3ezfDYcrBctE3pnngEb7fCcfk2WTJ5ILAqRKGyzI0yZxXtrInDTIlXi7ZkuYwpQIVNfWQ=="],"payload":"nEiBS4gtoIl7t2zW5NEIEUe/7WiSYW2riXVNTv49yk6D+s2niXX/mFaXbFkuRsrVZ2jdsOULWV0jqrGNtV1ck/YC8vCM6Hl3LyatNDWt/L2Dh2SKDhhnOj7PdgVCIfqcWpTlCPcdTsnaBG2LsVnPV9hPVWLxCWZqw+6FqcKJ55QIn/Xu4C2hjelTufJvYGfXG3gOIWjM4g/4fDHOpxAP0vP+TLOrsT9WiRYzGFRolpyJRIaFMUK6p5j04DDkJwHIOI/MZ0AVrCwv8tmiySoL0/lZgOd6hw3FvXbFgpX28zQwGbqmndYJ+dMfuVZYRSc4vR4JFT6DBbnVyWu7lCaj18qXTPAaMd3Bi5xtrlPeDoFu2fkQe5ysXTbesmT9Gvk81rR2k1iEbL6JaU0Ouy4fn9BadctBqiySyx2dTN3ZpKMHKup54JNVFG3WJoJCKIBuqLupKOR5AFn8eMgVqnnjLvmw6jrYlDDq1qa17gv9DuPxspbeFTes8rM89MY9B8933hFeUD2ySB4IwU5apLLUa56y/J6iPSbrIL2/0lIpD/xqOet6CabALPvJJWFnsQ==","rescue":"qMUr7wX+rkWXiH8ujNePGKQ2s51i6XjnZyrHWHMhsvT9ZRLqwFwhnyEAAg/n/9u4lVfmAVGG33RexCWoyiBimsH9wGa4lnzB/CCIUA=="}],"final":"HUYhohRYIwnUsg3FH0qLyeatbYwDhQIqw9KZcOtc4ozNjRxIXX+hZbRxbp45uh6rhEhOoYRS9KCMIHPKfucf2lAsjJ8kF15tOdBI1CT4+W4keuhWQDEqbeXdsfTi7zbILmSUn/4a5QiAE+Mq7CWGAUkr77wp/MDuY71FrqKxKBEtwi+zWrc6vE0rZ5ks3IWyFcXJlLETdFfbxo0ui8LX0A9zzDd7a9SsmP3nbO2l8WgmRgKt/P/5AlflFv1H7i56RcYiBCmZ5ceXKuf1DlkyJTtfC40cXp5sGcNam4h95nfoFjf/5Hk="};
const KEY = 'pedida-progreso';
const $ = document.getElementById('app');
const N = DATA.stages.length;
const fresh = () => ({ i: -1, arr: -1, secrets: [], wrong: 0, tries: 0, runs: 1, log: [], pw: '' });
if (/[?&]reset\b/.test(location.search)) {
  try { localStorage.removeItem(KEY); } catch {}
  history.replaceState(null, '', location.pathname);
}
let st = fresh();
try { st = { ...st, ...JSON.parse(localStorage.getItem(KEY)) }; } catch {}
const updateBar = () => { document.getElementById('cnt').textContent = `Partida ${st.runs} · Intentos ${st.tries}`; };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {} updateBar(); };
function restart() {
  if (!confirm('¿Reiniciar el juego desde cero?')) return;
  const runs = st.runs + 1;
  st = fresh(); st.runs = runs; save(); render();
}
document.getElementById('rst').onclick = restart;
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dots = () => `<div class="dots">${DATA.stages.map((_, k) => `<i class="${k < st.i ? 'on' : ''}"></i>`).join('')}</div>`;
const dist = (la1, lo1, la2, lo2) => {
  const r = Math.PI / 180, dLa = (la2 - la1) * r, dLo = (lo2 - lo1) * r;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(la1 * r) * Math.cos(la2 * r) * Math.sin(dLo / 2) ** 2;
  return 2 * 6371000 * Math.asin(Math.sqrt(h));
};
const fmtDist = (m) => (m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1)} km`);
const currentClue = () => (st.i === 0 ? DATA.intro.clue : st.log[st.i - 1]?.nextClue || '');

function renderIntro() {
  $.innerHTML = `<h1>${esc(DATA.title)}</h1>
    <div class="card"><p>${esc(DATA.herName)},</p><p>${esc(DATA.intro.text)}</p>
    <button class="primary" id="go">Empezar</button></div>`;
  document.getElementById('go').onclick = () => { st.i = 0; save(); render(); };
}

function renderStage() {
  const s = DATA.stages[st.i];
  const a = s.arrival;
  const hidden = a && st.arr !== st.i; // no revelar el lugar si hay pregunta de llegada
  const head = `${dots()}<div class="card"><div class="place">${hidden ? 'Etapa' : esc(s.place)} · ${st.i + 1}/${N}</div>
    <p class="clue">${esc(currentClue())}</p>`;
  if (st.arr !== st.i) {
    const arrive = () => { st.arr = st.i; save(); renderStage(); };
    // Sin GPS (o si falla) se usa la pregunta de llegada, o se entra directo
    const ask = () => {
      if (!a) return arrive();
      $.innerHTML = `${head}</div><div class="card"><h1 style="font-size:1.25rem">${esc(a.question)}</h1>
        ${a.options.map((o, k) => `<button data-a="${k}">${esc(o)}</button>`).join('')}</div>`;
      $.querySelectorAll('button[data-a]').forEach((b) => (b.onclick = () => {
        st.tries++;
        if (+b.dataset.a === a.correct) return arrive();
        st.wrong++; save();
        b.classList.add('bad'); b.disabled = true;
      }));
    };
    const far = (d) => {
      $.innerHTML = `${head}<p class="bad-msg">Todavía no parece que estés cerca (a unos ${fmtDist(d)}).</p>
        <button class="primary" id="retry">Reintentar</button>
        <button class="link" id="nogps">El GPS no me detecta bien</button></div>`;
      document.getElementById('retry').onclick = locate;
      document.getElementById('nogps').onclick = ask;
    };
    const locate = () => {
      const g = s.gps;
      if (!g || !navigator.geolocation) return ask();
      $.innerHTML = `${head}<p class="clue">Buscando tu ubicación…</p></div>`;
      navigator.geolocation.getCurrentPosition((pos) => {
        const d = dist(pos.coords.latitude, pos.coords.longitude, g.lat, g.lon);
        if (d - Math.min(pos.coords.accuracy || 0, 300) <= g.radius) arrive(); else far(d);
      }, () => ask(), { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
    };
    $.innerHTML = `${head}<button class="primary" id="arr">${esc(a ? a.button : 'Ya llegué a ' + s.place)}</button>
      ${s.gps ? '<p class="clue" style="font-size:.85rem">Para confirmar que llegaste, el teléfono te pedirá tu ubicación.</p>' : ''}</div>`;
    document.getElementById('arr').onclick = locate;
    return;
  }
  $.innerHTML = `${head}</div>
    <div class="card"><h1 style="font-size:1.25rem">${esc(s.question)}</h1>
    ${s.options.map((o, k) => `<button data-k="${k}">${esc(o)}</button>`).join('')}
    <button class="link" id="rescue">¿Atascada? Código de rescate</button></div>`;
  $.querySelectorAll('button[data-k]').forEach((b) => (b.onclick = () => answer(b, +b.dataset.k)));
  document.getElementById('rescue').onclick = async () => {
    const code = prompt('Código de rescate:');
    if (!code) return;
    const secret = await decrypt(s.rescue, norm(code));
    if (secret === null) return alert('Ese código no sirve.');
    advance(secret);
  };
}

async function answer(btn, k) {
  const s = DATA.stages[st.i];
  st.tries++;
  const secret = await decrypt(s.wraps[k], norm(s.options[k]));
  if (secret === null) {
    st.wrong++; save();
    btn.classList.add('bad'); btn.disabled = true;
    return;
  }
  advance(secret);
}

async function advance(secret) {
  const payload = JSON.parse(await decrypt(DATA.stages[st.i].payload, secret));
  st.secrets[st.i] = secret;
  st.log[st.i] = payload;
  st.i++;
  save();
  if (st.i >= N) return renderFinal();
  renderReveal(payload);
}

const linkHtml = (p) => (p.link ? `<p><a class="lnk" href="${esc(p.link.url)}" target="_blank" rel="noopener">${esc(p.link.label)}</a></p>` : '');

function renderReveal(p) {
  $.innerHTML = `${dots()}<div class="card"><p class="reveal">¡Correcto!</p><p>${esc(p.reveal)}</p>
    ${linkHtml(p)}<button class="primary" id="next">Siguiente pista</button></div>`;
  document.getElementById('next').onclick = renderStage;
}

const unlock = (pw) => decrypt(DATA.final, st.secrets.join('|') + '|' + pw);

function showMessage(f) {
  $.innerHTML = `<h1>${esc(f.title)}</h1>
    <div class="card"><p>${esc(f.message)}</p>
    <p class="clue">Intentos en esta partida: ${st.tries} (errores: ${st.wrong}).</p></div>`;
}

async function renderFinal() {
  if (st.pw) {
    const txt = await unlock(st.pw);
    if (txt !== null) return showMessage(JSON.parse(txt));
  }
  const last = st.log[N - 1];
  $.innerHTML = `${dots()}<div class="card"><p class="reveal">¡Correcto!</p><p>${esc(last.reveal)}</p>
    <p class="clue">${esc(last.nextClue)}</p></div>
    <div class="card"><p>Cuando lo encuentres, escribe la contraseña que trae.</p>
    <input id="pw" inputmode="numeric" autocomplete="off" placeholder="Contraseña">
    <button class="primary" id="ok">Abrir mensaje</button><p id="msg" class="bad-msg"></p></div>`;
  document.getElementById('ok').onclick = async () => {
    const pw = norm(document.getElementById('pw').value);
    const txt = await unlock(pw);
    if (txt === null) { st.tries++; save(); return (document.getElementById('msg').textContent = 'Esa no es la contraseña.'); }
    st.pw = pw; save();
    showMessage(JSON.parse(txt));
  };
}

function render() {
  if (st.i < 0) return renderIntro();
  if (st.i >= N) return renderFinal();
  renderStage();
}
updateBar();
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
