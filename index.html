// Cifrado compartido (build en Node y navegador): PBKDF2 + AES-GCM
const enc = new TextEncoder();
const dec = new TextDecoder();

const norm = (s) =>
  s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim().replace(/\s+/g, ' ');

const b64 = (u) => btoa(String.fromCharCode(...u));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function deriveKey(pass, salt) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
    base,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

async function encrypt(text, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pass, salt);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(text)));
  return b64(new Uint8Array([...salt, ...iv, ...ct]));
}

// Devuelve el texto o null si la clave es incorrecta
async function decrypt(blob, pass) {
  try {
    const raw = unb64(blob);
    const key = await deriveKey(pass, raw.slice(0, 16));
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(16, 28) }, key, raw.slice(28));
    return dec.decode(pt);
  } catch {
    return null;
  }
}

const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dots = () => `<div class="dots">${DATA.stages.map((_, k) => `<i class="${k < st.i ? 'on' : ''}"></i>`).join('')}</div>`;
const dist = (la1, lo1, la2, lo2) => {
  const r = Math.PI / 180, dLa = (la2 - la1) * r, dLo = (lo2 - lo1) * r;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(la1 * r) * Math.cos(la2 * r) * Math.sin(dLo / 2) ** 2;
  return 2 * 6371000 * Math.asin(Math.sqrt(h));
};
const fmtDist = (m) => (m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1)} km`);

const fmtClock = (ms) => { const s = Math.ceil(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

// Espera tras una respuesta errada: deshabilita las opciones y muestra la cuenta regresiva
function applyLock(sel) {
  clearInterval(lockTimer);
  const tick = () => {
    const box = document.getElementById('lock');
    if (!box) return clearInterval(lockTimer);
    const left = lockLeft();
    const btns = $.querySelectorAll(sel);
    if (left > 0) {
      btns.forEach((b) => (b.disabled = true));
      box.textContent = `Respuesta incorrecta. Podrás intentar de nuevo en ${fmtClock(left)}`;
    } else {
      clearInterval(lockTimer);
      box.textContent = '';
      btns.forEach((b) => { if (!b.classList.contains('bad')) b.disabled = false; });
    }
  };
  tick();
  if (lockLeft() > 0) lockTimer = setInterval(tick, 500);

    const far = (d) => {

        <button class="primary" id="retry">Reintentar</button>

      document.getElementById('retry').onclick = locate;
      document.getElementById('nogps').onclick = ask;
    };

      const g = s.gps;
      if (!g || !navigator.geolocation) return ask();
      $.innerHTML = `${head}<p class="clue">Buscando tu ubicación…</p></div>`;
      navigator.geolocation.getCurrentPosition((pos) => {
        const d = dist(pos.coords.latitude, pos.coords.longitude, g.lat, g.lon);

      }, () => ask(), { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });

    ${s.options.map((o, k) => `<button data-k="${k}">${esc(o)}</button>`).join('')}

    if (secret === null) return alert('Ese código no sirve.');

async function answer(btn, k) {
  const s = DATA.stages[st.i];
  if (lockLeft() > 0) return;
  st.tries++;
  const secret = await decrypt(s.wraps[k], norm(s.options[k]));
  if (secret === null) {
    st.wrong++; st.lockUntil = Date.now() + LOCK_MS; save();
    btn.classList.add('bad'); btn.disabled = true;
    applyLock('button[data-k]');
    return;
  }
  advance(secret);
}

  const payload = JSON.parse(await decrypt(DATA.stages[st.i].payload, secret));

  save();
  if (st.i >= N) return renderFinal();
  renderReveal(payload);
}

const linkHtml = (p) => (p.link ? `<p><a class="lnk" href="${esc(p.link.url)}" target="_blank" rel="noopener">${esc(p.link.label)}</a></p>` : '');

function renderReveal(p) {
  setBg(true);
  $.innerHTML = `${dots()}<div class="card"><p class="reveal">¡Correcto!</p><p>${esc(p.reveal)}</p>
    ${linkHtml(p)}<button class="primary" id="next">Siguiente pista</button></div>`;
  document.getElementById('next').onclick = renderStage;
}

const unlock = (pw) => decrypt(DATA.final, st.secrets.join('|') + '|' + pw);

function showMessage(f) {
  setBg(false);
  $.innerHTML = `<h1>${esc(f.title)}</h1>
    <div class="card"><p>${esc(f.message)}</p>
    <p class="clue">Intentos en esta partida: ${st.tries} (errores: ${st.wrong}).</p></div>
    ${f.note ? `<div class="card"><p class="clue">${esc(f.note)}</p></div>` : ''}
    <img class="hero small" src="jungla.jpg" alt="">`;
}

async function renderFinal() {
  if (st.pw) {
    const txt = await unlock(st.pw);
    if (txt !== null) return showMessage(JSON.parse(txt));
  }
  setBg(true);
  const last = st.log[N - 1];
  $.innerHTML = `${dots()}<div class="card"><p class="reveal">¡Correcto!</p><p>${esc(last.reveal)}</p>
    <p class="clue">${esc(last.nextClue)}</p></div>
    <div class="card"><p>Cuando lo encuentres, escribe la contraseña que trae.</p>
    <input id="pw" inputmode="numeric" autocomplete="off" placeholder="Contraseña">
    <button class="primary" id="ok">Abrir mensaje</button><p id="msg" class="bad-msg"></p></div>`;
  document.getElementById('ok').onclick = async () => {
    const pw = norm(document.getElementById('pw').value);
    const txt = await unlock(pw);
    if (txt === null) { st.tries++; save(); return (document.getElementById('msg').textContent = 'Esa no es la contraseña.'); }
    st.pw = pw; save();
    showMessage(JSON.parse(txt));
  };
}

// Puerta de apertura: se abre en DATA.opensAt (hora del servidor; si no hay red, la del teléfono)
const HERO = '<img class="hero" src="jungla.jpg" alt="Dos monitos jugando a las escondidas en la selva">';
const OPENS = DATA.opensAt ? Date.parse(DATA.opensAt) : 0;
let clockSkew = 0;
let bypass = false;
let gateTimer = null;
const nowMs = () => Date.now() + clockSkew;
const isClosed = () => OPENS > 0 && !bypass && nowMs() < OPENS;

async function syncClock() {
  try {
    if (typeof fetch !== 'function') return;
    const r = await fetch(location.pathname + '?t=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
    const d = r.headers.get('date');
    if (d) clockSkew = Date.parse(d) - Date.now();
  } catch {}
}

async function checkBypass() {
  try {
    const m = location.search.match(/[?&]pase=([^&]*)/);
    if (m && DATA.bypass && (await decrypt(DATA.bypass, norm(decodeURIComponent(m[1])))) === 'ok') localStorage.setItem('pedida-pase', '1');
    if (m) history.replaceState(null, '', location.pathname);
    return localStorage.getItem('pedida-pase') === '1';
  } catch { return false; }
}

function renderCountdown() {
  setBg(false);
  document.getElementById('bar').style.display = 'none';
  $.innerHTML = `${HERO}<h1>${esc(DATA.title)}</h1>
    <div class="card"><p>${esc(DATA.herName)},</p>
    <p>Todavía no es hora. Este juego se abre el <b>${esc(DATA.opensLabel)}</b></p>
    <p class="count" id="count"></p></div>`;
  clearInterval(gateTimer);
  const tick = () => {
    const el = document.getElementById('count');
    if (!el) return clearInterval(gateTimer);
    const left = OPENS - nowMs();
    if (left <= 0) { clearInterval(gateTimer); document.getElementById('bar').style.display = ''; return render(); }
    const s = Math.floor(left / 1000), p = (n) => String(n).padStart(2, '0');
    el.textContent = `${Math.floor(s / 86400)}d ${p(Math.floor((s % 86400) / 3600))}h ${p(Math.floor((s % 3600) / 60))}m ${p(s % 60)}s`;
  };
  tick();
  gateTimer = setInterval(tick, 1000);
}

function render() {
  if (isClosed()) return renderCountdown();
  if (st.i < 0) return renderIntro();
  if (st.i >= N) return renderFinal();
  renderStage();
}
(async () => { await syncClock(); bypass = await checkBypass(); updateBar(); render(); })();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
